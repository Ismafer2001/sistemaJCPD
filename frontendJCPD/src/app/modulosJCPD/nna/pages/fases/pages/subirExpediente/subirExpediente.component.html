<div class="pl-2 py-2 mb-1 flex items-center gap-2">
  <a
    [routerLink]="[`../../fases/${denunciaId}`]"
      class=" px-3 py-1 font-medium rounded-xl  text-base text-left leading-tight transition-colors duration-200 flex items-center justify-center bg-gray-500 text-white hover:bg-gray-600  focus:ring-2 focus:ring-gray-500"
    >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"  class=" size-5 ">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
        </svg>
    </a>
  <h3 class="text-2xl font-bold">Expedientes</h3>
</div>
<hr class="border-yellow-300 border-1" />


<form [formGroup]="expedienteForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data" class="expediente-form p-4 bg-white rounded shadow max-w-md mx-auto mt-6">
  <div class="mb-4">
    <label for="tipoExpediente" class="block text-sm font-medium text-gray-700 mb-1">Tipo de Expediente</label>
    <select id="tipoExpediente" formControlName="tipoExpediente" required
      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 focus:border-2 focus:outline-none placeholder-gray-400 placeholder-opacity-75">
      <option value="" disabled selected hidden>Seleccione...</option>
      <option value="denuncia">Denuncia</option>
      <option value="avocatoria">Avocatoria</option>
      <option value="providencia">Providencia</option>
      <option value="notificaciones">Notificaciones</option>
      <option value="citaciones">Citaciones</option>
      <option value="audiencia de contestacion">Audiencia de Contestacion</option>
      <option value="audiencia de pruebas">Audiencia de Pruebas</option>
      <option value="resoluciones">Resoluciones</option>
      <option value="cierre de caso">Cierre de Caso</option>
      <option value="informes">Informes</option>
    </select>
  </div>
  <div class="mb-4">
    <label class="block text-sm font-medium text-gray-700 mb-1">Archivo</label>
    <label for="file" class="flex items-center justify-center gap-2 cursor-pointer border-2 border-dashed border-blue-400 rounded-md py-6 bg-blue-50 hover:bg-blue-100 transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7.828a2 2 0 0 0-.586-1.414l-3.828-3.828A2 2 0 0 0 13.172 2H7zm5 1.414L18.586 8H15a2 2 0 0 1-2-2V4.414z" />
      </svg>
      <span class="text-blue-600 font-semibold">Haz clic para seleccionar un archivo</span>
      <input id="file" type="file" (change)="onFileSelected($event)" required class="hidden" />
    </label>
    <div *ngIf="selectedFile" class="mt-2 text-sm text-gray-700">Archivo seleccionado: <span class="font-medium">{{ selectedFile.name }}</span></div>
  </div>
  <app-button-submit
    type="submit"
    label="Subir Expediente"
    color="afirmar"
    [loading]="loading"
    [loadingText]="loadingMessage"
    [disabled]="expedienteForm.invalid || !selectedFile"
  ></app-button-submit>
</form>

<div class="bg-gray-50 rounded-xl shadow-inner p-4 border mt-2">
  <h3 class="font-bold mb-4 text-blue-500 text-lg flex items-center gap-2"><span class="material-icons text-blue-400">list_alt</span> Expedientes</h3>
    <app-tablaEdit
    [columnas]="['filename', 'tipoExpediente']"
    [encabezados]="['Archivo', 'Tipo de Expediente']"
    [datos]="expedientes"
    [isLoading]="isLoadingExpedientes"
    emptyMessage="No hay expedientes registrados"
    loadingMessage="Cargando expedientes..."
    [descargar]="descargarArchivo.bind(this)"
    [acciones]="true"
    [mostrarEditar]="true"
    [editar]="editarExpediente.bind(this)"
  ></app-tablaEdit>

</div>
