<div class="pl-2 py-2 mb-1 flex items-center gap-2">
  <h3 class="text-2xl font-bold">Gestión de Usuarios</h3>
</div>

<hr class="border-yellow-300 border-1" />

<div class="bg-gray-50 b p-4 shadow-lg overflow-y-scroll h-[calc(100vh-8rem)]">

  <!-- Formulario de usuario -->
  <app-card-Form [titulo]="modoEdicion ? 'Editar Usuario' : 'Crear Nuevo Usuario'">
    <form [formGroup]="userForm"  class="space-y-4">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <!-- Campo Usuario -->
        <app-inputs
          label="Usuario *"
          type="text"
          placeholder="Ingrese el nombre de usuario"
          [control]="$any(userForm.get('usuario')!)"
        >
          Este campo es obligatorio
        </app-inputs>

        <!-- Campo Nombres -->
        <app-inputs
          label="Nombres *"
          type="text"
          placeholder="Ingrese los nombres"
          [control]="$any(userForm.get('nombres')!)"
        >
          Este campo es obligatorio
        </app-inputs>

        <!-- Campo Apellidos -->
        <app-inputs
          label="Apellidos *"
          type="text"
          placeholder="Ingrese los apellidos"
          [control]="$any(userForm.get('apellidos')!)"
        >
          Este campo es obligatorio
        </app-inputs>

        <!-- Campo Correo -->
        <app-inputs
          label="Correo Electrónico *"
          type="email"
          placeholder="ejemplo@correo.com"
          [control]="$any(userForm.get('correo')!)"
        >
          Este campo es obligatorio
        </app-inputs>

        <!-- Campo Contraseña -->
        <app-inputs
          label="Contraseña *"
          type="password"
          placeholder="Ingrese la contraseña"
          [control]="$any(userForm.get('contrasena')!)"
        >
          Este campo es obligatorio
        </app-inputs>

        <!-- Campo Rol -->
        <div>
          <label for="rol" class="block text-sm font-medium text-gray-700 mb-2">
            Rol *
          </label>
          <select
            id="rol"
            formControlName="rol"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
            [class.border-red-500]="userForm.get('rol')?.invalid && userForm.get('rol')?.touched"
          >
            <option value="principal">Principal</option>
            <option value="suplente">Suplente</option>
            <option value="admin">Administrador</option>
            <option value="secretaria">Secretaria</option>
          </select>
          <div
            *ngIf="userForm.get('rol')?.invalid && userForm.get('rol')?.touched"
            class="text-red-500 text-sm mt-1"
          >
            Este campo es obligatorio
          </div>
        </div>

        <!-- Campo Cantón -->
        <div>
          <label for="id_canton" class="block text-sm font-medium text-gray-700 mb-2">
            Cantón *
          </label>
          <select
            id="id_canton"
            formControlName="id_canton"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
            [class.border-red-500]="userForm.get('id_canton')?.invalid && userForm.get('id_canton')?.touched"
          >
            <option value="">Seleccione un cantón</option>
            <option *ngFor="let canton of cantones" [value]="canton.id">
              {{ canton.canton }}
            </option>
          </select>
          <div
            *ngIf="userForm.get('id_canton')?.invalid && userForm.get('id_canton')?.touched"
            class="text-red-500 text-sm mt-1"
          >
            Este campo es obligatorio
          </div>
        </div>

        <!-- Campo Estado Activo -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Estado
          </label>
          <div class="flex items-center">
            <input
              type="checkbox"
              id="isactivo"
              formControlName="isactivo"
              class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
            />
            <label for="isactivo" class="ml-2 block text-sm text-gray-700">
              Usuario activo
            </label>
          </div>
        </div>

      </div>

      <!-- Botones -->
      <div class="flex gap-3 pt-4">
        <!-- Botones modo creación -->
        <div *ngIf="!modoEdicion" class="flex gap-3">
          <app-button-submit
            [type]="'submit'"
            [label]="'Crear Usuario'"
            [color]="'submit'"
            [disabled]="userForm.invalid || buttonCrearUsuario"
            [loading]="buttonCrearUsuario"
            (clicked)="crearUsuario()"
          >
        
        </app-button-submit>


        </div>

        <!-- Botones modo edición -->
        <div *ngIf="modoEdicion" class="flex gap-3">
          <app-button-submit
            [type]="'button'"
            [label]="'Actualizar Usuario'"
            [color]="'afirmar'"
            [icon]="'edit'"
            [disabled]="userForm.invalid || buttonCrearUsuario"
            (clicked)="actualizarUsuario()"
          ></app-button-submit>

          <app-button-submit
            [type]="'button'"
            [label]="'Cancelar'"
            [color]="'cancelar'"
            (clicked)="cancelarEdicion()"
          ></app-button-submit>
        </div>
      </div>
    </form>
  </app-card-Form>

  <!-- Tabla de usuarios -->
  <app-card-Form [titulo]="'Usuarios Registrados'">
    <div class="bg-white rounded-lg shadow">
      <app-tablaEdit
       [columnas]="['id', 'usuario', 'nombres','apellidos','rol','canton']"
    [encabezados]="['#', 'Usuario', 'Nombres','Apellidos','Rol','Cantón']"
    [datos]="usuarios"
    [acciones]="true"
    [botonEstado]="true"
    [mostrarEditar]="true"
    [estado]="cambiarEstado.bind(this)"
    [eliminar]="eliminar.bind(this)"
    [editar]="editar.bind(this)"
      >
    </app-tablaEdit>
    </div>
  </app-card-Form>

</div>

<!-- Modal de validación de contraseña -->
<shared-modal
  *ngIf="mostrarModalValidacion"
  [config]="modalConfig"
  [valor]="passwordValidacion"
  [mensajeError]="errorModal"
  (valorChange)="passwordValidacion = $event"
  (confirmado)="validarPasswordAdmin($event)"
  (cancelado)="cerrarModalValidacion()"
></shared-modal>
