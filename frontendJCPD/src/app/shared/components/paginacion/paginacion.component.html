<nav class="flex items-center justify-center space-x-2 py-3">
  
  <button
    type="button"
    (click)="prev()"
    class="px-3 py-1 rounded-md border hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed"
    [disabled]="currentPage<=1"
    aria-label="Página anterior"
  >
    <svg class="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
  </button>

  <ul class="flex items-center gap-1 list-none m-0 p-0">
    <li *ngFor="let p of pages">
      <button
        *ngIf="p !== '...'"
        type="button"
        (click)="goTo(+p)"
        [class]="p === currentPage ? 'px-3 py-1 rounded-md bg-blue-600 text-white font-medium' : 'px-3 py-1 rounded-md border hover:bg-gray-50'"
        [attr.aria-current]="p === currentPage ? 'page' : null"
      >
        {{ p }}
      </button>
      <span *ngIf="p === '...'" class="px-2 text-gray-400">…</span>
    </li>
  </ul>

  <button
    type="button"
    (click)="next()"
    class="px-3 py-1 rounded-md border hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed"
    [disabled]="currentPage>=totalPages"
    aria-label="Página siguiente"
  >
    <svg class="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
  </button>
</nav>
