<!-- Dialog nativo -->
<dialog
  #modalDialog
  class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 rounded-lg shadow-xl max-w-md w-full mx-4 p-0 backdrop:bg-gray-900/50"
>

  <!-- Header del modal -->
  <div class="flex items-center justify-between p-4 border-b border-gray-200">
    <h3 class="text-lg font-semibold text-gray-900">{{ config.titulo }}</h3>
    <button
      type="button"
      class="text-gray-400 hover:text-gray-600 focus:outline-none focus:text-gray-600 transition ease-in-out duration-150"
      (click)="cancelar()"
    >
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Contenido del modal -->
  <div class="p-4">

    <!-- Descripción -->
    <div *ngIf="config.descripcion" class="mb-4">
      <p class="text-sm text-gray-600">{{ config.descripcion }}</p>
    </div>

    <!-- Input (opcional) -->
    <div *ngIf="config.mostrarInput !== false" class="mb-6">
      
      <input
        type="password"
        [value]="valor"
        (input)="onInputChange($event)"
        [placeholder]="config.placeholderInput || 'ingrese contraseña'"
        class="w-full px-3 py-2 border rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 focus:outline-none"
        [class.border-red-300]="mensajeError"
        [class.border-gray-300]="!mensajeError"
        autofocus
      />
      
      <!-- Mensaje de error debajo del input -->
      <div *ngIf="mensajeError" class="mt-2">
        <p class="text-sm text-red-600">{{ mensajeError }}</p>
      </div>
    </div>

  </div>

  <!-- Footer con botones -->
  <div class="flex justify-end space-x-3 p-4 border-t border-gray-200">
    <!-- Botón Aceptar -->
    <app-button-submit
      [type]="'button'"
      [label]="'Aceptar'"
      [color]="'afirmar'"
      (clicked)="confirmar()"></app-button-submit>
    <!-- Botón Rechazar -->
    <app-button-submit
      [type]="'button'"
      [label]="'Cancelar'"
      [color]="'cancelar'"
      (clicked)="cancelar()"
    ></app-button-submit>


  </div>

</dialog>
