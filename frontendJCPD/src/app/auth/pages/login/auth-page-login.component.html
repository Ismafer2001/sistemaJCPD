<main class="bg-gray-200 flex  justify-center py-12 px-4 sm:px-6 lg:px-8">

  <p>Hoy es: {{ hoy | date:'fullDate' }}</p>


      <div class="flex flex-col max-w-md w-max bg-white p-8 rounded-xl shadow-lg gap-1">
        <div class="flex flex-col items-center ">
          <img
            alt="Logo Ecuador"
            class="h-16 w-auto "
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuCvv5O4ZQvX-r7LQg4BA5_JDVOoHrKaUBSUxXPw5wHlxhMNLc0Z3dLh3whbq32me2wiLMuu8nxPvVSHAqvmuo8EueXl8WNySK2gznH9EvQd8rDwFHv0w5hcosu1e_-UQBls1W59XO1v_3sVAA-nZBo0t516Y6XIJzmfDJbvVHmCeMTVsfvbOn6Ep_TteXm9zo5BJdM75Ner54CVa0vE8mt9aSLF4tyD3RabHOmz3qP8pllzpbT3zv25VSNpMXrk6eL6Glsn83DjTn1X"
          />
          <h2 class="text-center text-xl font-semibold text-gray-700">
            Consejo Nacional para la Igualdad Intergeneracional
          </h2>
        </div>
        <form [formGroup]="loginform" (ngSubmit)="login()" class="space-y-2">
          <div>
            <label
              class="block text-sm font-medium text-gray-700"
              for="username"
              >Usuario</label
            >
            <div class="mt-1 relative rounded-md shadow-sm">
              <div
                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
              >
                <span class="material-icons text-gray-400">person</span>
              </div>
              <input
                formControlName="usuario"
                name="username"
                id="username"
                type="text"
                placeholder="Usuario"

                class="focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-2.5"
              />
            </div>


          </div>
          <div>
            <label
              class="block text-sm font-medium text-gray-700"
              for="password"
              >Contraseña</label
            >
            <div class="mt-1 relative rounded-md shadow-sm">
              <div
                class="absolute inset-y-0 left-0 pl-3 flex items-center "
              >
                <span class="material-icons text-gray-400">lock</span>
              </div>
              <input
                formControlName="contrasena"
                id="password"
                name="contrasena"
                [type]="passwordVisible ? 'text' : 'password'"
                placeholder="Contraseña"

                class="focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-2.5"
              />
              <div class="absolute inset-y-0 right-0 w-17  flex ">
                <button class="   text-gray-400 hover:text-gray-500" type="button" (click)="togglePasswordVisibility()" >
                  <span class=" material-icons">{{ passwordVisible ? 'visibility' : 'visibility_off' }}</span>
                </button>
              </div>
            </div>

          </div>
          <div class="flex items-center">
            <input
              formControlName="recordar"
              class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300 rounded accent-green-500"
              id="remember-me"
              name="remember-me"
              type="checkbox"
            />
            <label class="ml-2 block text-sm text-gray-900" for="remember-me">
              Recordar mis Datos
            </label>
          </div>
          <div class="flex items-center text-red-600 text-sm">
            <span *ngIf="error" class="material-icons text-base mr-1"></span>
            {{ error }}
          </div>
          <div>
            <button
            [disabled]="loading"
              class="w-full flex justify-center py-2.5 px-4 border  rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50"
              type="submit"
            >
              INICIAR SESIÓN
              @if (loading) {
                <span class="material-icons ml-2 animate-spin">refresh</span>

              }

            </button>
          </div>

          <!--<div>
            <button
              class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-500 hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
              type="button"
            >
              REGISTRAR
            </button>
          </div>-->
          <div class="text-center">
            <a
              class="text-sm text-gray-600 hover:text-gray-900 underline"
              href="#"
            >
              Olvidé la Contraseña
            </a>
          </div>
        </form>
      </div>



</main>
