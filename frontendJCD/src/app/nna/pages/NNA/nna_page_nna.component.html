<div class="bg-white p-4">
  <div class="flex justify-between items-center mb-4">
    <div class="flex items-center space-x-3">
      <a routerLink="" class="bg-gray-800 text-white px-3 py-1 rounded">&larr;</a>
      <a routerLink="crearDenuncia" class="bg-yellow-400 text-black px-4 py-2 rounded flex items-center hover:bg-yellow-500 transition">
        <span class="mr-2">Nueva denuncia</span>
        <span class="text-xl">+</span>
      </a>
    </div>
    <div class="w-[250px]">
      <div class="flex border rounded overflow-hidden">
        <input type="text" class="w-full px-3 py-2 outline-none" placeholder="Buscar...">
        <span class="flex items-center justify-center px-3 bg-gray-200"><i class="bi bi-search"></i></span>
      </div>
    </div>
  </div>

  <!-- Loading spinner -->
  <div *ngIf="loading" class="text-center py-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <!-- Error message -->
  <div *ngIf="error" class="alert alert-danger" role="alert">
    {{ error }}
  </div>

  <!-- Table -->
  <div class="overflow-x-auto" *ngIf="!loading && !error">
    <table class="min-w-full table-auto border text-sm">
      <thead class="bg-blue-100">
        <tr>
          <th class="p-2 border">ID</th>
          <th class="p-2 border">Nombre</th>
          <th class="p-2 border">Fecha</th>
          <th class="p-2 border">Tipo</th>
          <th class="p-2 border">Estado</th>
          <th class="p-2 border">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let denuncia of denuncias" class="hover:bg-gray-50">
          <td class="p-2 border">{{ denuncia.id }}</td>
          <td class="p-2 border">
            <ng-container *ngIf="denuncia.afectados && denuncia.afectados.length > 0">
              {{ denuncia.afectados[0].nombre }} {{ denuncia.afectados[0].apellido }}
            </ng-container>
          </td>
          <td class="p-2 border">{{ denuncia.fecha_creado | date:'dd/MM/yyyy' }}</td>
          <td class="p-2 border">{{ denuncia.tipo_denuncia }}</td>
          <td class="p-2 border">
            <span [ngClass]="{
              'px-2 py-1 rounded text-xs font-medium': true,
              'bg-green-100 text-green-800': denuncia.estado === 'activo',
              'bg-yellow-100 text-yellow-800': denuncia.estado === 'pendiente',
              'bg-red-100 text-red-800': denuncia.estado === 'inactivo'
            }">
              {{ denuncia.estado }}
            </span>
          </td>
          <td class="p-2 border">
            <div class="flex space-x-2 justify-center">
              <button class="text-blue-600 hover:text-blue-800" [routerLink]="['/nna/denuncia', denuncia.id]">
                <i class="bi bi-eye"></i>
              </button>
              <button class="text-yellow-600 hover:text-yellow-800">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="text-red-600 hover:text-red-800">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
