<div class="container mx-auto px-4 py-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Crear Nueva Denuncia</h1>

    <form [formGroup]="denunciaForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Sección del Denunciante -->
      <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-xl font-semibold mb-4">Datos del Denunciante</h2>
        <nna_creardenuncia_denunciante [formGroup]="denuncianteForm"></nna_creardenuncia_denunciante>
      </div>

      <!-- Sección de Afectados -->
      <div class="mb-8">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-semibold text-gray-800">Datos de los Afectados</h2>
          <button
            type="button"
            (click)="agregarAfectado()"
            class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
          >
            Agregar Afectado
          </button>
        </div>
        <div formArrayName="afectados">
          <div *ngFor="let afectado of afectadosArray.controls; let i = index" class="mb-6 p-4 border rounded-lg">
            <div class="flex justify-between items-center mb-4">
              <h3 class="text-lg font-medium text-gray-700">Afectado {{i + 1}}</h3>
              <button
                *ngIf="afectadosArray.length > 1"
                type="button"
                (click)="eliminarAfectado(i)"
                class="px-3 py-1 bg-red-600 text-white rounded-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2"
              >
                Eliminar
              </button>
            </div>
            <nna_creardenuncia_afectado [formGroup]="asFormGroup(afectado)"></nna_creardenuncia_afectado>
          </div>
        </div>
      </div>

      <!-- Sección de Denunciados -->
      <div class="mb-8">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-semibold text-gray-800">Datos de los Denunciados</h2>
          <button
            type="button"
            (click)="agregarDenunciado()"
            class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
          >
            Agregar Denunciado
          </button>
        </div>
        <div formArrayName="denunciados">
          <div *ngFor="let denunciado of denunciadosArray.controls; let i = index" class="mb-6 p-4 border rounded-lg">
            <div class="flex justify-between items-center mb-4">
              <h3 class="text-lg font-medium text-gray-700">Denunciado {{i + 1}}</h3>
              <button
                *ngIf="denunciadosArray.length > 1"
                type="button"
                (click)="eliminarDenunciado(i)"
                class="px-3 py-1 bg-red-600 text-white rounded-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2"
              >
                Eliminar
              </button>
            </div>
            <nna_creardenuncia_denunciado [formGroup]="asFormGroup(denunciado)"></nna_creardenuncia_denunciado>
          </div>
        </div>
      </div>

      <!-- Sección de Hechos -->
      <div class="mb-8">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Hechos y Vulneraciones</h2>
        <app-nna_creardenuncia_hechos [formGroup]="denunciaForm.get('hechos')"></app-nna_creardenuncia_hechos>
      </div>

      <!-- Mensajes de error y éxito -->
      <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
        <span class="block sm:inline">{{ error }}</span>
      </div>

      <!-- Botones de acción -->
      <div class="flex justify-end space-x-4">
        <button
          type="button"
          (click)="cancelar()"
          class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:opacity-50"
          [disabled]="denunciaForm.invalid || loading"
        >
          <span *ngIf="loading">Guardando...</span>
          <span *ngIf="!loading">Guardar</span>
        </button>
      </div>
    </form>
  </div>
</div>
