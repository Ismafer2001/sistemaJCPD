<div class="p-6 bg-white rounded-lg shadow-md">
  <!-- Formulario de Hechos -->
  <form [formGroup]="formGroup" class="space-y-6">
    <div>
      <label for="descripcion_hechos" class="block text-sm font-medium text-gray-700">
        Descripción de los Hechos
      </label>
      <textarea
        id="descripcion_hechos"
        formControlName="descripcion_hechos"
        rows="4"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
        placeholder="Describa los hechos ocurridos..."
      ></textarea>
      <div *ngIf="formGroup.get('descripcion_hechos')?.errors?.['required'] && formGroup.get('descripcion_hechos')?.touched"
           class="mt-1 text-sm text-red-600">
        La descripción es requerida
      </div>
      <div *ngIf="formGroup.get('descripcion_hechos')?.errors?.['minlength'] && formGroup.get('descripcion_hechos')?.touched"
           class="mt-1 text-sm text-red-600">
        La descripción debe tener al menos 10 caracteres
      </div>
    </div>
  </form>

  <!-- Lista de Vulneraciones -->
  <div class="mt-8">
    <h3 class="text-lg font-medium text-gray-900 mb-4">Seleccione las Vulneraciones</h3>
    <div class="space-y-2">
      <div *ngFor="let vulneracion of vulneraciones"
           class="flex items-center p-3 bg-gray-50 rounded-lg hover:bg-gray-100 cursor-pointer"
           (click)="toggleVulneracion(vulneracion.id)">
        <div class="flex items-center h-5">
          <input
            type="checkbox"
            [checked]="isVulneracionSelected(vulneracion.id)"
            class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
            (click)="$event.stopPropagation()"
          >
        </div>
        <div class="ml-3">
          <label class="text-sm font-medium text-gray-700">
            {{vulneracion.nombre}}
          </label>
        </div>
      </div>
    </div>
    <div *ngIf="formGroup.get('vulneraciones')?.errors?.['required'] && formGroup.get('vulneraciones')?.touched"
         class="mt-2 text-sm text-red-600">
      Debe seleccionar al menos una vulneración
    </div>
  </div>
</div>
