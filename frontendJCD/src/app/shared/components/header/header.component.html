<header class="flex justify-between items-center bg-blue-200 px-4 py-2 h-14 rounded-r-xl fixed top-0 left-0 right-0 z-50 shadow-md">
  <h1 class="m-0 text-gray-700 font-semibold">{{nombreModulo||moduloActual}}</h1>

  <!-- Usuario y menú -->
  <div class="relative flex items-center gap-3">
    <!-- Cantón -->
    <div>
      <p class="font-medium">{{cantonUsuario}}</p>
    </div>

    <!-- Avatar -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-11">
  <path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" clip-rule="evenodd" />
</svg>


    <!-- Botón usuario (abre menú) -->
    <button
      (click)="toggleMenu()"
      class="flex flex-col items-start px-3 py-1 rounded-md hover:bg-blue-300 transition"
    >
      <p class="text-sm font-medium m-0">{{ nombreUsuario }}</p>
      <p class="text-xs text-gray-500 m-0">{{ rolUsuario }}</p>
    </button>

    <!-- Menú desplegable -->
    @if (mostrarMenuUsuario) {
      <div class="absolute top-13 right-0 w-56 bg-blue-50 rounded-md border-1 border-blue-300 shadow-lg z-50">
        <ul class="py-1 text-sm text-gray-700">
          <li><a routerLink="/mi-perfil" class="block px-4 py-2 hover:bg-gray-100">👤 Mi perfil</a></li>
          <li><a routerLink="/configuracion" class="block px-4 py-2 hover:bg-gray-100">⚙️ Configuración</a></li>
          <li><a routerLink="/cambiar-clave" class="block px-4 py-2 hover:bg-gray-100">🔐 Cambiar contraseña</a></li>


        </ul>
      </div>
    }
  </div>
</header>
