<table class=" table-fixed  w-full text-sm text-left  ">
      <thead class="bg-blue-50  ">
        <tr class="">
          @for (header of encabezados; track $index) {
            <th class=" p-2 w-1">{{header}}</th>
          }

          @if(acciones){
            <th class=" p-1 w-1">
              acciones
            </th>

          }


        </tr>
      </thead>
      <tbody class="">
        @for (item of datos; track $index) {

          <tr class="hover:bg-gray-50  border-t-2 border-t-blue-100  " >
            @for (col of columnas; track $index) {

              <td class=" whitespace-pre-line  p-2">{{item[col] }}</td>

            }
            @if (botonEstado) {
            <th class="p-2">
              Estado
            </th>
          }

          @if (acciones) {
            <td class="p-2">
              @if (mostrarEditar) {
                <button (click)="editar(item)"
              class="bg-blue-500 hover:bg-blue-600 text-white text-xs px-2 py-1 rounded">
                editar
              </button>

              }

              <button (click)="eliminar(item)"class="bg-red-500 hover:bg-red-600 text-white text-xs px-2 py-1 rounded">
                eliminar
              </button>
            </td>

          }

          </tr>

        }

      </tbody>
    </table>
