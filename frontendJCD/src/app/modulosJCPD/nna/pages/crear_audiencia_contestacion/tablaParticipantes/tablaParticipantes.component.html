<table class=" table-auto  w-full text-sm text-left  ">
      <thead class="bg-blue-50  ">
        <tr class="">
          @for (header of encabezados; track $index) {
            <th class=" p-2 ">{{header}}</th>
          }
          <th class="p-2" >Asistió</th>
          <th class="p-2" >Justificó</th>
           @if (botonEstado) {
            <th class="p-2">
              Estado
            </th>
          }

          @if(acciones){
            <th class=" p-1 ">
              acciones
            </th>

          }


        </tr>
      </thead>
      <tbody class="">
        @for (item of datos; track $index) {
          <tr class="hover:bg-gray-50  border-t-2 border-t-blue-100  " >
            @for (col of columnas; track $index) {
              <td class=" whitespace-pre-line  p-2">{{item[col] }}</td>
            }
            <!-- Checkbox de asistencia -->
            <td class="p-2 text-center" >
              <input type="checkbox" [checked]="item.asistio" (change)="onCheckboxChange($event, item, $index)" />
            </td>
            <!-- Checkbox de justificación -->
            <td class="p-2 text-center" >
              <input type="checkbox" [checked]="item.justifico" (change)="onJustificoChange($event, item, $index)" />
            </td>

            @if (acciones) {
              <td class="p-2 flex ">
                @if (mostrarEditar) {
                  <button type="button" (click)="editar(item, $index)"
                class=" w-10 h-10  flex items-center justify-center text-gray-700 font-medium transition-colors duration-200 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed hover:bg-blue-700 hover:text-white'">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4">
  <path d="M13.488 2.513a1.75 1.75 0 0 0-2.475 0L6.75 6.774a2.75 2.75 0 0 0-.596.892l-.848 2.047a.75.75 0 0 0 .98.98l2.047-.848a2.75 2.75 0 0 0 .892-.596l4.261-4.262a1.75 1.75 0 0 0 0-2.474Z" />
  <path d="M4.75 3.5c-.69 0-1.25.56-1.25 1.25v6.5c0 .69.56 1.25 1.25 1.25h6.5c.69 0 1.25-.56 1.25-1.25V9A.75.75 0 0 1 14 9v2.25A2.75 2.75 0 0 1 11.25 14h-6.5A2.75 2.75 0 0 1 2 11.25v-6.5A2.75 2.75 0 0 1 4.75 2H7a.75.75 0 0 1 0 1.5H4.75Z" />
</svg>

                </button>
                }
                <button type="button" (click)="eliminar(item, $index)"class="w-10 h-10 flex items-center justify-center text-gray-700 font-medium transition-colors duration-200 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed hover:bg-red-700 hover:text-white'">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4">
  <path fill-rule="evenodd" d="M5 3.25V4H2.75a.75.75 0 0 0 0 1.5h.3l.815 8.15A1.5 1.5 0 0 0 5.357 15h5.285a1.5 1.5 0 0 0 1.493-1.35l.815-8.15h.3a.75.75 0 0 0 0-1.5H11v-.75A2.25 2.25 0 0 0 8.75 1h-1.5A2.25 2.25 0 0 0 5 3.25Zm2.25-.75a.75.75 0 0 0-.75.75V4h3v-.75a.75.75 0 0 0-.75-.75h-1.5ZM6.05 6a.75.75 0 0 1 .787.713l.275 5.5a.75.75 0 0 1-1.498.075l-.275-5.5A.75.75 0 0 1 6.05 6Zm3.9 0a.75.75 0 0 1 .712.787l-.275 5.5a.75.75 0 0 1-1.498-.075l.275-5.5a.75.75 0 0 1 .786-.711Z" clip-rule="evenodd" />
</svg>

                </button>
              </td>
            }
          </tr>
        }

      </tbody>
    </table>
