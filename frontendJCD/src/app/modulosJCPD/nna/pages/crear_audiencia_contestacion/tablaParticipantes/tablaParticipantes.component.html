<table class=" table-auto  w-full text-sm text-left  ">
      <thead class="bg-blue-50  ">
        <tr class="">
          @for (header of encabezados; track $index) {
            <th class=" p-2 ">{{header}}</th>
          }
          <th class="p-2" >Asistió</th>
          <th class="p-2" >Justificó</th>
           @if (botonEstado) {
            <th class="p-2">
              Estado
            </th>
          }

          @if(acciones){
            <th class=" p-1 ">
              acciones
            </th>

          }


        </tr>
      </thead>
      <tbody class="">
        @for (item of datos; track $index) {
          <tr class="hover:bg-gray-50  border-t-2 border-t-blue-100  " >
            @for (col of columnas; track $index) {
              <td class=" whitespace-pre-line  p-2">{{item[col] }}</td>
            }
            <!-- Checkbox de asistencia -->
            <td class="p-2 text-center" >
              <input type="checkbox" [checked]="item.asistio" (change)="onCheckboxChange($event, item, $index)" />
            </td>
            <!-- Checkbox de justificación -->
            <td class="p-2 text-center" >
              <input type="checkbox" [checked]="item.justifico" (change)="onJustificoChange($event, item, $index)" />
            </td>

            @if (acciones) {
              <td class="p-2">
                @if (mostrarEditar) {
                  <button type="button" (click)="editar(item, $index)"
                class="bg-blue-500 hover:bg-blue-600 text-white text-xs px-2 py-1 rounded mr-1">
                  <i class="fas fa-edit mr-1"></i>editar
                </button>
                }
                <button type="button" (click)="eliminar(item, $index)"class="bg-red-500 hover:bg-red-600 text-white text-xs px-2 py-1 rounded">
                  <i class="fas fa-trash mr-1"></i>eliminar
                </button>
              </td>
            }
          </tr>
        }

      </tbody>
    </table>
