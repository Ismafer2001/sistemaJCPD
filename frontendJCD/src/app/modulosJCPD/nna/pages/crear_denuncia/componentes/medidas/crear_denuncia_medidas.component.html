<div [formGroup]="medidasForm" class="space-y-6">
  <!-- Mensaje de carga -->
  <div *ngIf="loading" class="text-center py-4">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
    <p class="mt-2 text-gray-600">Cargando medidas...</p>
  </div>

  <!-- Mensaje de error -->
  <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
    <span class="block sm:inline">{{ error }}</span>
  </div>
  <div class="mb-4">
    <app-button-submit
      type="button"
      label="Agregar Medidas"
      color="afirmar"
      (clicked)="agregarMedida()"
    >
    </app-button-submit>

  </div>

  <!--selector de afectados-->
    <div class="">
      <label class="block text-sm font-medium text-gray-700">afectados</label>
      <select
        formControlName="id_afectado"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
      >
        <option value=""  disabled selected hidden >Seleccione...</option>
        @for(afectado of formAfectados.controls; track afectado; let i = $index)
        {

        <option [value]= "i" >{{ afectado.value.nombres }}</option>

        }
      </select>
    </div>

  <!-- Lista de medidas por artículo -->
  <div *ngIf="!loading && !error" class="flex gap-2 space-y-6 ">
    <div *ngFor="let articulo of medidasPorArticulo" class=" bg-white ring-1 ring-blue-200 rounded-lg shadow-md pt-0 p-1 h-48 overflow-auto">
      <h3 class=" bg-white sticky top-0 text-lg font-semibold text-gray-800 mb-1 h-8">{{ articulo.articulo }}</h3>

      <div class="space-y-3">
        <div *ngFor="let medida of articulo.medidas" class=" bg-gray-50 rounded-lg p-3 hover:bg-gray-100 cursor-pointer flex items-start">
          <div class="flex items-center h-5">
            <input
              type="checkbox"
              [id]="'medida-' + medida.id"
              [checked]="isMedidaSelected(medida.id)"
              (change)="toggleMedida(medida.id)"
              class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
            >
          </div>
          <div class="ml-3">
            <label [for]="'medida-' + medida.id" class="text-sm text-gray-700">
              {{ medida.medida }}
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class=" overflow-x-auto rounded-xl bg-white shadow-xl md:col-span-2">
      <app-tablaEdit
      [encabezados]="['afectado','medidas ']"
      [columnas]="['id_afectado', 'medidasPorArticulo']"
      [datos]="mapeoAfectados"
      [acciones]="true"
      [eliminar]="eliminarRegistro.bind(this)"

    >

    </app-tablaEdit>

    </div>

  <!-- Mensaje cuando no hay medidas -->
  <div *ngIf="!loading && !error && medidasPorArticulo.length === 0" class="text-center py-4">
    <p class="text-gray-600">No hay medidas disponibles</p>
  </div>
</div>
