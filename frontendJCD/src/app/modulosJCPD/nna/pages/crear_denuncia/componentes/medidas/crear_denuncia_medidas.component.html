<div [formGroup]="medidasForm" class="space-y-6">
  <!-- Mensaje de carga -->
  <div *ngIf="loading" class="text-center py-4">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
    <p class="mt-2 text-gray-600">Cargando medidas...</p>
  </div>



  <div class="grid grid-cols-2 gap-6">
    <!-- Columna Izquierda: Selector de afectados y botones -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Afectados</label>
      <select
        formControlName="idAfectado"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 focus:border-2 focus:outline-none"
        [ngClass]="{
          ' border-1 border-red-500': medidasForm.get('idAfectado')?.invalid && medidasForm.get('idAfectado')?.touched
        }"
      >
        <option value="" disabled selected hidden>Seleccione afectado</option>
        @for(afectado of formAfectados.controls; track afectado; let i = $index)
        {
          <option [value]="i">{{ afectado.value.nombres }}</option>
        }
      </select>
      <div
      *ngIf="
        medidasForm.get('idAfectado')?.invalid && medidasForm.get('idAfectado')?.touched
      "
      class="text-red-500 text-sm mt-1"
    >
      <span *ngIf="medidasForm.get('idAfectado')?.errors?.['required']"
        >El afectado es requerido</span>
    </div>

    <!-- Botones de acción -->
    <div class="mt-4 flex flex-col gap-4">
      <app-button-submit
        type="button"
        [label]="modoEdicion ? 'Actualizar' : 'Agregar'"
        [color]="modoEdicion ? 'afirmar' : 'submit'"
        [icon]="modoEdicion ? 'edit' : 'plus'"
        (clicked)="agregarMedida()"
      >
      </app-button-submit>

      <app-button-submit
        *ngIf="modoEdicion"
        type="button"
        label="Cancelar"
        color="cancelar"
        (clicked)="cancelarEdicion()"
      >
      </app-button-submit>
    </div>
  </div>

  <!-- Columna Derecha: Filtro y lista de medidas -->
  <div>
    <!-- Selector de Artículo -->
    <div class="flex items-center gap-2 mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-4 h-4 text-gray-500 flex-shrink-0">
        <path d="M14 2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v2.172a2 2 0 0 0 .586 1.414l2.828 2.828A2 2 0 0 1 6 9.828v4.363a.5.5 0 0 0 .724.447l2.17-1.085A2 2 0 0 0 10 11.763V9.829a2 2 0 0 1 .586-1.414l2.828-2.828A2 2 0 0 0 14 4.172V2Z" />
      </svg>
      
      <select
        formControlName="articuloFiltro"
        class="flex-1 text-sm py-1.5 px-2 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 focus:border-2 focus:outline-none"
      >
        <option value="">Todos los artículos</option>
        <option *ngFor="let articulo of articulosDisponibles" [value]="articulo.id">
          {{ articulo.articulo }}
        </option>
      </select>
    </div>

    <!-- Lista de medidas filtradas -->
    <div *ngIf="!loading && !error" class="h-80 overflow-y-auto scrollbar-hide rounded-xl p-3 ring-1 ring-blue-200"
      [ngClass]="{
        ' border-1 border-red-500': medidasForm.get('ids_medidas')?.invalid && medidasForm.get('ids_medidas')?.touched
      }">
      
      <div
        *ngIf="medidasForm.get('ids_medidas')?.errors?.['required'] && medidasForm.get('ids_medidas')?.touched"
        class="mb-2 text-sm text-red-600"
      >
        Debe seleccionar al menos una medida
      </div>

      <!-- Información del filtro activo -->
      <div *ngIf="medidasForm.get('articuloFiltro')?.value" class="mb-3 p-2 bg-blue-50 rounded-lg">
        <p class="text-xs text-blue-600">
          <i class="fas fa-filter"></i>
          Mostrando medidas de: 
          <strong>{{ getNombreArticuloSeleccionado() }}</strong>
        </p>
      </div>

      <!-- Mensaje cuando no hay medidas disponibles -->
      <div *ngIf="medidasFiltradas.length === 0" class="p-4 text-center text-gray-500">
        <i class="fas fa-info-circle"></i>
        <p class="mt-2">No hay medidas disponibles para el filtro seleccionado</p>
      </div>

      <fieldset class="space-y-2">
        <div
          *ngFor="let medida of medidasFiltradas"
          class="flex items-center p-3 bg-gray-50 rounded-lg hover:bg-gray-100 cursor-pointer transition-colors"
        >
          <div class="flex items-center h-5">
            <input
              type="checkbox"
              [id]="'medida-' + medida.id"
              [checked]="isMedidaSelected(medida.id)"
              (change)="toggleMedida(medida.id)"
              class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
            />
          </div>
          <div class="ml-3 flex-1">
            <label class="text-sm font-medium text-gray-700 cursor-pointer" [for]="'medida-' + medida.id">
              {{ medida.medida }}
            </label>
            <p class="text-xs text-gray-500 mt-1">
              {{ getArticuloDeMedida(medida.id) }}
            </p>
          </div>
        </div>
      </fieldset>
    </div>
  </div>
</div>

<div class="bg-gray-50 rounded-xl shadow-inner p-4 border mt-2">
  <h3 class="font-bold mb-4 text-blue-500 text-lg flex items-center gap-2">
    <span class="material-icons text-blue-400">list_alt</span> 
    Medidas registradas
  </h3>
  <app-tablaEdit
    [encabezados]="['afectado','medidas']"
    [columnas]="['idAfectado', 'medidasPorArticulo']"
    [datos]="mapeoAfectados"
    [acciones]="true"
    [eliminar]="eliminarRegistro.bind(this)"
    [mostrarEditar]="true"
    [editar]="editarMedidas.bind(this)"
  >
  </app-tablaEdit>
</div>

<!-- Mensaje cuando no hay medidas -->
<div *ngIf="!loading && !error && medidasPorArticulo.length === 0" class="text-center py-4">
  <p class="text-gray-600">No hay medidas disponibles</p>
</div>
</div>
