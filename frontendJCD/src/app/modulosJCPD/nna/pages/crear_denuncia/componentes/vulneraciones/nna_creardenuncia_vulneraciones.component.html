
  <!-- Lista de Vulneraciones -->
  <div [formGroup]="vulneracionesForm" class="mt-4">


    <div class="grid grid-cols-3 gap-2">
      <!--selector de afectados-->
    <div class="" >
      <label class="block text-sm font-medium text-gray-700">afectados</label>
      <select
        formControlName="idAfectado"
        class="mt-1 block w-full rounded-md  border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 focus:border-2 focus:outline-none"
        [ngClass]="{
          ' border-1 border-red-500': vulneracionesForm.get('idAfectado')?.invalid && vulneracionesForm.get('idAfectado')?.touched
        }"
      >
        <option value=""  disabled selected hidden >Seleccione afectado</option>
        @for(afectado of formAfectados.controls; track afectado; let i = $index)
        {

        <option [value]="i">{{ afectado.value.nombres }}</option>

        }
      </select>
      <div
      *ngIf="
        vulneracionesForm.get('idAfectado')?.invalid && vulneracionesForm.get('idAfectado')?.touched
      "
      class="text-red-500 text-sm mt-1"
    >
      <span *ngIf="vulneracionesForm.get('idAfectado')?.errors?.['required']"
        >El afectado es requerido</span>
    </div>
      <div class="mt-4 flex flex-col gap-4">
      <app-button-submit
        type="button"
        [label]="modoEdicion ? 'Actualizar Vulneraciones' : 'Agregar Vulneraciones'"
        color="afirmar"
        (clicked)="agregarVulneraciones()"
      >
      </app-button-submit>

      <app-button-submit
        *ngIf="modoEdicion"
        type="button"
        label="Cancelar Edición"
        color="cancelar"
        (clicked)="cancelarEdicion()"
      >
      </app-button-submit>

    </div>
    </div>
    <!--seleccionar vulneraciones-->

    <div class=" col-span-2 h-48 overflow-y-auto scrollbar-hide my-4  rounded-xl p-1 ring-1 ring-blue-200"
     [ngClass]="{
          ' border-1 border-red-500': vulneracionesForm.get('vulneraciones')?.invalid && vulneracionesForm.get('vulneraciones')?.touched
        }">
      <div
      *ngIf="vulneracionesForm.get('vulneraciones')?.errors?.['required'] && vulneracionesForm.get('vulneraciones')?.touched"
      class="mt-2 text-sm text-red-600"
    >
      Debe seleccionar al menos una vulneración
    </div>
      <fieldset class="space-y-2">

        <div
          *ngFor="let v of vulneraciones"
          class="flex items-center p-3 bg-gray-50 rounded-lg hover:bg-gray-100 cursor-pointer"
        >
          <div class="flex items-center h-5">
            <input
              [checked]="isVulneracionSelected(v.id)"
              (change)="toggleVulneracion(v.id)"

              type="checkbox"
              class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
            />
          </div>
          <div class="ml-3">
            <label class="text-sm font-medium text-gray-700">
              {{ v.vulneracion }}
            </label>
          </div>
        </div>
      </fieldset>
    </div>

    </div>


    <div class=" overflow-x-auto rounded-xl bg-white shadow-xl md:col-span-2">
      <app-tablaEdit
      [encabezados]="['afectado','vulneraciones',]"
      [columnas]="['idAfectado', 'vulneraciones']"
      [datos]="mapeoAfectados"
      [acciones]="true"
      [eliminar]="eliminarRegistro.bind(this)"
      [mostrarEditar]="true"
      [editar]="editarVulneraciones.bind(this)"
    >

    </app-tablaEdit>

    </div>


    <!--mensajes de error inicio-->

    <!--mensajes de erro fin-->
  </div>
