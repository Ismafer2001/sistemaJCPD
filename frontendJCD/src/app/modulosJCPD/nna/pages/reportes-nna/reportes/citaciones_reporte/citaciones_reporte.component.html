<div class="p-6 max-w-7xl mx-auto space-y-8">


    <!-- Título -->
     <div>
    <h1 class="text-3xl font-bold text-gray-800"><span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-10 text-gray-500">
  <path fill-rule="evenodd" d="M2.25 2.25a.75.75 0 0 0 0 1.5H3v10.5a3 3 0 0 0 3 3h1.21l-1.172 3.513a.75.75 0 0 0 1.424.474l.329-.987h8.418l.33.987a.75.75 0 0 0 1.422-.474l-1.17-3.513H18a3 3 0 0 0 3-3V3.75h.75a.75.75 0 0 0 0-1.5H2.25Zm6.04 16.5.5-1.5h6.42l.5 1.5H8.29Zm7.46-12a.75.75 0 0 0-1.5 0v6a.75.75 0 0 0 1.5 0v-6Zm-3 2.25a.75.75 0 0 0-1.5 0v3.75a.75.75 0 0 0 1.5 0V9Zm-3 2.25a.75.75 0 0 0-1.5 0v1.5a.75.75 0 0 0 1.5 0v-1.5Z" clip-rule="evenodd" />
</svg></span> Reporte General de Citaciones</h1>
    <p class="text-gray-500 mt-1">Resumen estadístico </p>
  </div>

    <!-- Filtro por fechas -->
     <!-- 🔍 Filtro por fechas -->
   <app-filtro class=" flex flex-col md:flex-row "
     [filtroForm]="filtroForm"
     [filtrar]="filtrar.bind(this)">
   </app-filtro>

    <!-- Tarjetas resumen de citaciones -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">

      <!-- Citaciones Totales -->
      <div class="bg-white p-6 rounded-xl shadow border-l-4 border-blue-600 flex items-center justify-between">
        <div>
          <h2 class="text-lg font-semibold text-gray-700">Citaciones Totales</h2>
          <p class="text-sm text-gray-500">Acumuladas en el sistema</p>
        </div>
        <div class="text-blue-600 text-4xl font-bold">
          {{citaciones?.total || 0}}
        </div>
      </div>

      <!-- Citaciones por denuncia de oficio -->
      <div class="bg-white p-6 rounded-xl shadow border-l-4 border-indigo-500 flex items-center justify-between">
        <div>
          <h2 class="text-lg font-semibold text-gray-700">Denuncias de Oficio</h2>
          <p class="text-sm text-gray-500">Citaciones relacionadas</p>
        </div>
        <div class="text-indigo-600 text-4xl font-bold">
          {{citaciones?.oficio || 0}}
        </div>
      </div>

      <!-- Citaciones por denuncia externa -->
      <div class="bg-white p-6 rounded-xl shadow border-l-4 border-rose-500 flex items-center justify-between">
        <div>
          <h2 class="text-lg font-semibold text-gray-700">Denuncias Externas</h2>
          <p class="text-sm text-gray-500">Citaciones relacionadas</p>
        </div>
        <div class="text-rose-600 text-4xl font-bold">
          {{citaciones?.externa || 0}}
        </div>
      </div>

    </div>

    <!-- (Opcional) Acá podrías agregar una tabla de detalle o una gráfica -->


</div>
