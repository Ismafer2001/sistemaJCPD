<form  [formGroup]="filtroForm" (ngSubmit)="filtrar()">
    <div class="bg-white p-4 rounded-xl shadow flex flex-col md:flex-row items-center justify-between gap-4">
    <div>
      <h2 class="text-lg font-semibold text-gray-800"><span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 text-blue-700">

  <path fill-rule="evenodd" d="M6.75 2.25A.75.75 0 0 1 7.5 3v1.5h9V3A.75.75 0 0 1 18 3v1.5h.75a3 3 0 0 1 3 3v11.25a3 3 0 0 1-3 3H5.25a3 3 0 0 1-3-3V7.5a3 3 0 0 1 3-3H6V3a.75.75 0 0 1 .75-.75Zm13.5 9a1.5 1.5 0 0 0-1.5-1.5H5.25a1.5 1.5 0 0 0-1.5 1.5v7.5a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5v-7.5Z" clip-rule="evenodd" />
</svg>
</span> Filtrar por fechas</h2>
      <p class="text-sm text-gray-500">Seleccioná un rango de fechas para ver estadísticas específicas</p>
    </div>
    <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
      <div>
        <label class="text-sm text-gray-600">Desde</label>
        <input type="date" formControlName="desde"
               class="mt-1 block w-full sm:w-44 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm" />
      </div>
      <div>
        <label class="text-sm text-gray-600">Hasta</label>
        <input type="date" formControlName="hasta"
               class="mt-1 block w-full sm:w-44 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm" />
      </div>
      <div class="self-end">
        <button
        type="submit"
          class="w-full sm:w-auto px-4 py-2 rounded-md bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 transition">
          Filtrar
        </button>
      </div>
    </div>
  </div>

   </form>
