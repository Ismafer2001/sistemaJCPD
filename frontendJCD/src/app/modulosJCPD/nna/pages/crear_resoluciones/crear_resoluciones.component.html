<div class="pl-2 py-2 mb-1">
  <h1 class="text-2xl font-bold">Crear Resoluciones</h1>
</div>

<hr class="border-yellow-300 border-1" />
   <div class="flex  mb-0 gap-3 " id="tabs">
    <button type="button" class="rounded-t-2xl p-2"
       [ngClass]="{
      'bg-blue-500 text-white': currentTab === '0',
      'bg-gray-100': currentTab !== '0'
    }"
      (click)="cambiarTab('0')"

    >
      inicio
    </button>
    <button type="button"
      class="bg-gray-100 focus:bg-blue-500 rounded-t-2xl p-2"
      (click)="cambiarTab('1')"

      [ngClass]="{
      'bg-blue-500 text-white': currentTab  != '1',

    }"
    >
     Pruebas
    </button>
    <button type="button"
      class="bg-gray-100 focus:bg-blue-500 rounded-t-2xl p-2"
      (click)="cambiarTab('2')"

      [ngClass]="{
      'bg-blue-500 text-white': currentTab  != '2',

    }"
    >
     Medidas de proteccion
    </button>
     @if (currentTab==="3") {
      <a
      class="bg-gray-100 focus:bg-blue-500 rounded-t-2xl p-2"
      (click)="cambiarTab('3')"


      [ngClass]="{

      'bg-blue-500 text-white': currentTab === '3',
      'bg-gray-100': currentTab !== '3'
    }"
    >
      pdf
    </a>

    }
    <div class="flex flex-1 m-1 justify-end space-x-4">
      <app-button-submit
        type="button"
        label="Cancelar"
        color="cancelar"

      >
      </app-button-submit>
       <app-button-submit
    type="button"
    label="Editar"
    color="afirmar"

     [disabled]="editarDisabled"


    >

    </app-button-submit>
      <app-button-submit type="button"
       label="Guardar"
        color="submit"
        (clicked)="submitResoluciones()"

      [disabled]="guardarDisabled"
      >
      </app-button-submit>
      <app-button-submit
    type="button"
    label="GenerarPDF"
    color="submit"
    [disabled]="pdfDisabled"



    >

    </app-button-submit>


    </div>


  </div>
<form [formGroup]="resolucionesForm" class="bg-gray-50 b p-4 shadow-lg border-t-1 border-t-blue-300 overflow-y-scroll h-[calc(100vh-8rem)]">


  <app-card-Form
    [titulo]="'consideraciones'"
      [hidden]="currentTab != '0'"
    >
    <div>
        <quill-editor

          [modules]="modules"
          formControlName="consideraciones"

          class="w-full h-50"
        >
        </quill-editor>
      </div>

  </app-card-Form>
  <app-card-Form
   [titulo]="'Resoluciones'"
      [hidden]="currentTab != '1'"
  >
  <div>
        <quill-editor
          [modules]="modules"
          formControlName="resolucion"

          class="w-full h-50"
        >
        </quill-editor>
      </div>

  </app-card-Form>
  <app-card-Form [titulo]="'Medidas de proteccion'"
        [hidden]="currentTab != '2'">

    <form [formGroup]="medidasDefinitivasForm">

      <!-- Selector de afectados -->
           <div class="grid grid-cols-3 gap-2">
            <div class="h-full">
            <label
              for="afectados"
              class="block text-sm font-medium text-gray-700 "
              >Seleccionar afectado</label
            >
            <select
              (change)="medidaDefinitiva($event)"
              id="afectados"
              formControlName="idAfectado"
              class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 focus:border-2 focus:outline-none"
            >
              <option value=""  disabled selected hidden >Seleccione...</option>
              @for (item of afectados; track $index) {
              <option [value]="item.id">{{ item.nombres }}</option>
              }
            </select>

            <div>
            <label
              for="medida"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              medida</label
            >
            <input
              type="text"
              [readonly]="true"
              formControlName="medida"
              id="medida"
              name="medida"
              class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 focus:border-2 focus:outline-none placeholder-gray-400 placeholder-opacity-75"
              placeholder="medida"
            />
          </div>
          <div>
            <label
              for="periodo"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Por periodo</label
            >
            <input
              type="text"
              formControlName="periodo"
              id="periodo"
              name="periodo"
              class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 focus:border-2 focus:outline-none placeholder-gray-400 placeholder-opacity-75"
              placeholder="Ej: Julio - Septiembre"
            />
          </div>
          <div>
            <label
              for="observaciones"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Observaciones</label
            >
            <textarea
              id="observaciones"
              formControlName="observaciones"
              name="observaciones"
              rows="3"
              class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 focus:border-2 focus:outline-none placeholder-gray-400 placeholder-opacity-75"
              placeholder="Escriba sus observaciones..."
            ></textarea>
          </div>

          </div>

          <!-- Tabla de medidas -->
          <!-- Tabla de medidas emergentes -->

          <!-- Lista de medidas por artículo -->
          <div class="flex col-span-2 my-4 gap-2 h-60 ">
            @for (articulo of medidasPorArticulo; track $index) {

            <div
              class="bg-white ring-1 ring-blue-200 rounded-lg shadow-md pt-0 p-1  overflow-auto"
            >
              <h3
                class="bg-white sticky top-0 text-lg font-semibold text-gray-800 mb-1 h-8"
              >
                {{ articulo.articulo }}
              </h3>

              <div class="space-y-3">
                <div
                  *ngFor="let medida of articulo.medidas"
                  class="bg-gray-50 rounded-lg p-3 hover:bg-gray-100 cursor-pointer flex items-start"
                >

                  <div class="flex items-center h-5">
                    <input
                      type="radio"
                      [value]="medida.id"
                      [formControlName]="'idMedida'"
                      [id]="'medida-' + medida.id"
                      class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                    />
                  </div>
                  <div class="ml-3">
                    <label
                      [for]="'medida-' + medida.id"
                      class="text-sm text-gray-700"
                    >
                      {{ medida.medida }}
                    </label>
                  </div>
                </div>
              </div>
            </div>

            }
          </div>

           </div>
          <div class="mt-2">
            <button
              type="button"
              (click)="agregarMedidasDefinitivas()"

              class="bg-blue-600 text-white text-sm px-5 py-2 rounded-md shadow hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              Guardar
            </button>


          </div>


        </form>
        <div

          class="mt-4 bg-white rounded shadow"
        >
          <app-tablaEdit
            [encabezados]="['ID', 'Medida ', 'Periodo', 'Observaciones']"
            [columnas]="['idMedida', 'medida', 'periodo', 'observaciones']"
            [datos]="medidasDefinitivas"


          ></app-tablaEdit>
        </div>




  </app-card-Form>


</form>
