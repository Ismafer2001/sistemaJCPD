<div class="pl-2 py-2 mb-1 flex items-center gap-2">
  <a
    [routerLink]="[`../../../fases/${denunciaId}`]"

      class=" px-3 py-1 font-medium rounded-xl  text-base text-left leading-tight transition-colors duration-200 flex items-center justify-center bg-gray-500 text-white hover:bg-gray-600  focus:ring-2 focus:ring-gray-500"
    >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"  class=" size-5 ">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
        </svg>

    </a>
  <h3 class="text-2xl font-bold">Resoluciones</h3>

</div>
<hr class="border-yellow-300 border-1" />

  <app-nav-formulario
  [tabs]="tabsConfig"
  [actions]="actionsConfig"
  [currentTab]="currentTab"
  (tabChanged)="cambiarTab($event)"
  (actionClicked)="handleAction($event)"
></app-nav-formulario>
<form [formGroup]="resolucionesForm" class="bg-gray-50 b p-4 shadow-lg border-t-1 border-t-blue-300 overflow-y-scroll h-[calc(100vh-8rem)]">


  <app-card-Form
    [titulo]="'Consideraciones'"
      [hidden]="currentTab != 0"
    >
    <div>
        <quill-editor

          [modules]="modules"
          formControlName="consideraciones"

          class="w-full h-50"
        >
        </quill-editor>
      </div>

  </app-card-Form>
  <app-card-Form
   [titulo]="'Resoluciones'"
      [hidden]="currentTab != 1"
  >
  <div>
        <quill-editor
          [modules]="modules"
          formControlName="resolucion"

          class="w-full h-50"
        >
        </quill-editor>
      </div>

  </app-card-Form>
  <app-card-Form [titulo]="'Medidas de proteccion'"
        [hidden]="currentTab != 2">

    <form [formGroup]="medidasDefinitivasForm" class="bg-white rounded-xl shadow-md p-4 border  ">

      <!-- Selector de afectados -->
           <div class="grid grid-cols-3 gap-2">
            <div class="h-full">
            <label
              for="afectados"
              class="block text-sm font-medium text-gray-700 "
              >Seleccionar afectado</label
            >
            <select
              (change)="medidaDefinitiva($event)"
              id="afectados"
              formControlName="idAfectado"
              class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 focus:border-2 focus:outline-none"
            >
              <option value=""  disabled selected hidden >Seleccione...</option>
              @for (item of afectados; track $index) {
              <option [value]="item.id">{{ item.nombres }}</option>
              }
            </select>

            <div>
            <label
              for="medida"
              class="block text-sm font-medium text-gray-700 mb-1"
            >
              medida</label
            >
            <input
              type="text"
              [readonly]="true"
              formControlName="medida"
              id="medida"
              name="medida"
              class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 focus:border-2 focus:outline-none placeholder-gray-400 placeholder-opacity-75"
              placeholder="medida"
            />
          </div>
          <div>
            <label
              for="periodo"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Por periodo</label
            >
            <input
              type="text"
              formControlName="periodo"
              id="periodo"
              name="periodo"
              class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 focus:border-2 focus:outline-none placeholder-gray-400 placeholder-opacity-75"
              placeholder="Ej: Julio - Septiembre"
            />
          </div>
          <div>
            <label
              for="observaciones"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Observaciones</label
            >
            <textarea
              id="observaciones"
              formControlName="observaciones"
              name="observaciones"
              rows="3"
              class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 focus:border-2 focus:outline-none placeholder-gray-400 placeholder-opacity-75"
              placeholder="Escriba sus observaciones..."
            ></textarea>
          </div>

          </div>

          <!-- Tabla de medidas -->
          <!-- Tabla de medidas emergentes -->

          <!-- Lista de medidas por artículo -->
          <div class="flex col-span-2 my-4 gap-2 h-60 ">
            @for (articulo of medidasPorArticulo; track $index) {

            <div
              class="bg-white ring-1 ring-blue-200 rounded-lg shadow-md pt-0 p-1  overflow-auto"
            >
              <h3
                class="bg-white sticky top-0 text-lg font-semibold text-gray-800 mb-1 h-8"
              >
                {{ articulo.articulo }}
              </h3>

              <div class="space-y-3">
                <div
                  *ngFor="let medida of articulo.medidas"
                  class="bg-gray-50 rounded-lg p-3 hover:bg-gray-100 cursor-pointer flex items-start"
                >

                  <div class="flex items-center h-5">
                    <input
                      type="radio"
                      [value]="medida.id"
                      [formControlName]="'idMedida'"
                      [id]="'medida-' + medida.id"
                      class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                    />
                  </div>
                  <div class="ml-3">
                    <label
                      [for]="'medida-' + medida.id"
                      class="text-sm text-gray-700"
                    >
                      {{ medida.medida }}
                    </label>
                  </div>
                </div>
              </div>
            </div>

            }
          </div>

           </div>
          <div class="flex gap-2 mt-2">
            <!-- Botón principal: Agregar o Actualizar según el modo -->
            <app-button-submit
              type="button"
              [label]="editMedidasMode ? 'Actualizar' : 'Agregar'"
              [color]="'submit' "
              [icon]="editMedidasMode ? 'edit' : 'plus'"
              (clicked)="editMedidasMode ? actualizarMedida() : agregarMedidasDefinitivas()">
            </app-button-submit>

            <!-- Botón Cancelar: Solo visible en modo edición -->

            <app-button-submit
              *ngIf="editMedidasMode"
              label="Cancelar"
              type="button"
              color="cancelar"
              (clicked)="cancelarEdicionMedidas()"
              >
            </app-button-submit>
          </div>


        </form>
        <div

          class="bg-gray-50 rounded-xl shadow-inner p-4 border mt-2"
        >
          <app-tablaEdit
            [encabezados]="['ID', 'Medida ', 'Periodo', 'Observaciones']"
            [columnas]="['idMedida', 'medida', 'periodo', 'observaciones']"
            [datos]="medidasDefinitivas"
            [acciones]="true"
            [mostrarEditar]="true"
            [eliminar]="eliminarMedida.bind(this)"
            [editar]="SeleccionarParaEditar.bind(this)"


          ></app-tablaEdit>
        </div>




  </app-card-Form>
  @if (pdfSrc) {
        <div class="pdf-container" [hidden]="currentTab !== 3">
          <iframe [src]="pdfSrc" width="100%" height="500px"></iframe>
        </div>
      }


</form>
