<app-card-Form [titulo]="'Control de impugnación'">
  <form [formGroup]="controlInpugnacionForm" class="space-y-6">
    <!-- Campo Expediente -->
    <div class="space-y-2">
      <label class="block text-sm font-medium text-gray-700">
        EXPEDIENTE <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        class="mt-1 block w-full rounded-lg border border-gray-300 shadow-sm px-3 py-2 focus:border-blue-500 focus:ring-blue-500 focus:border-2 focus:outline-none placeholder-gray-400 transition-colors"
        placeholder="Ej.: EXP-045-2025"
        formControlName="codigoTramite"
      />
    </div>

    <!-- Campo Resolución Impugnada -->
    <div class="space-y-2">
      <label for="resolucion_impugnada" class="block text-sm font-medium text-gray-700">
        RESOLUCIÓN QUE FUE IMPUGNADA <span class="text-red-500">*</span>
      </label>
      <textarea
        id="resolucion_impugnada"
        rows="4"
        class="mt-1 block w-full rounded-lg border border-gray-300 shadow-sm px-3 py-2 focus:border-blue-500 focus:ring-blue-500 focus:border-2 focus:outline-none resize-none transition-colors"
        placeholder="Ej.: Resolución N.º 023-2025, de fecha 15/07/2025, que negó la medida de protección solicitada por considerarse improcedente según el artículo..."
        formControlName="resolucionImpugnada"
      ></textarea>
    </div>

    <!-- Campo Resultado de la Impugnación -->
    <fieldset class="space-y-4">
      <legend class="text-sm font-medium text-gray-700 mb-3">
        RESULTADO DE LA IMPUGNACIÓN <span class="text-red-500">*</span>
      </legend>
      <div class="flex gap-4 w-full">
        <!-- Opción: Reposición -->
        <div class="flex items-center justify-center space-x-2 p-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors flex-1">
          <input
            type="radio"
            id="reposicion"

            class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500"
            value="reposicion"
            formControlName="resultadoImpugnacion"
          />
          <label for="reposicion" class="text-sm text-gray-700 cursor-pointer font-medium">
            Reposición
          </label>
        </div>

        <!-- Opción: Apelación -->
        <div class="flex items-center justify-center space-x-2 p-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors flex-1">
          <input
            type="radio"
            id="apelacion"

            class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500"
            value="apelacion"
            formControlName="resultadoImpugnacion"
          />
          <label for="apelacion" class="text-sm text-gray-700 cursor-pointer font-medium">
            Apelación
          </label>
        </div>

        <!-- Opción: Desistimiento -->
        <div class="flex items-center justify-center space-x-2 p-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors flex-1">
          <input
            type="radio"
            id="desistimiento"

            class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500"
            value="desistimiento"
            formControlName="resultadoImpugnacion"
          />
          <label for="desistimiento" class="text-sm text-gray-700 cursor-pointer font-medium">
            Desistimiento
          </label>
        </div>
      </div>
    </fieldset>

    <!-- Botón de envío -->
    <div class="pt-4 border-t border-gray-200 flex justify-end">
      <app-button-submit [label]="'Guardar Control de Impugnación'"
      (click)="crearControlImpugnacion()"></app-button-submit>
    </div>
  </form>
</app-card-Form>
