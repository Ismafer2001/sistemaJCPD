<section class="mb-4">

  <app-card-Form>
    <div class="flex justify-center text-center gap-5 ">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
        <!-- Tarjeta de usuarios -->
        <div class="bg-white p-5 shadow-md rounded-2xl border border-gray-200 flex flex-col justify-center items-center">
          <h2 class="text-lg font-semibold text-blue-700 mb-3 flex items-center gap-2">
            <svg class="w-6 h-6 text-blue-500" fill="currentColor" viewBox="0 0 20 20">
              <path d="M10 2a8 8 0 100 16 8 8 0 000-16zm3 9h-2v2a1 1 0 11-2 0v-2H7a1 1 0 110-2h2V7a1 1 0 112 0v2h2a1 1 0 110 2z"/>
            </svg>
            Principales activos
          </h2>

          <ul class="w-full mt-2 divide-y divide-gray-100">
            <li *ngIf="!miembrosPrincipales || miembrosPrincipales.length === 0" class="text-gray-500 italic py-2 text-center">
              No hay usuarios activos
            </li>

            <li *ngFor="let user of miembrosPrincipales" class="py-2 flex items-center gap-3">
              <div class="w-10 h-10 flex items-center justify-center bg-blue-100 rounded-full text-blue-600 font-semibold">
                {{ user.nombres.charAt(0) }}
              </div>
              <span class="font-medium text-gray-900">{{ user.nombres }} {{ user.apellidos }}</span>
            </li>
          </ul>
        </div>

        <!-- Tarjeta de denuncias -->
        <div class="bg-white p-5 shadow-md rounded-2xl border border-gray-200 flex flex-col justify-center items-center">
          <h2 class="text-lg font-semibold text-green-700 mb-2 flex items-center gap-2">
            <svg class="w-6 h-6 text-green-500" fill="currentColor" viewBox="0 0 20 20">
              <path d="M3 10a7 7 0 1114 0A7 7 0 013 10z"/>
            </svg>
            Denuncias activas
          </h2>
          <p class="text-5xl font-extrabold text-gray-800">{{ denunciasActivas }}</p>
        </div>
      </div>
    </div>
  </app-card-Form>

</section>

<section>
  <div class="flex justify-between items-center mb-4">
    <div class="flex items-center space-x-3">
      <app-button-submit type="button" label="Denuncia" color="accion" [icon]="'plus'" [link]="['denuncia', 'crear']"></app-button-submit>
    </div>

    <!-- Sistema de filtros -->
    <form [formGroup]="filtroForm" class="flex items-center space-x-3">
      <!-- Selector de tipo de filtro -->
      <div class="min-w-[200px]">
        <select
          formControlName="tipoFiltro"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        >
          <option value="">Seleccionar filtro</option>
          <option *ngFor="let opcion of opcionesFiltro" [value]="opcion.value">
            {{ opcion.label }}
          </option>
        </select>
      </div>

      <!-- Campo de búsqueda -->
      <div class="flex border border-gray-300 rounded-lg overflow-hidden min-w-[300px]">
        <input
          type="text"
          formControlName="valorBusqueda"
          [placeholder]="getPlaceholderText()"
          (keyup)="onBusquedaKeyUp($event)"
          class="w-full px-3 py-2 outline-none disabled:bg-gray-100 disabled:cursor-not-allowed"
        />
        <button
          type="button"
          (click)="aplicarFiltro()"
          [disabled]="!filtroForm.get('valorBusqueda')?.enabled || !filtroForm.get('valorBusqueda')?.value?.trim()"
          class="flex items-center justify-center px-4 bg-blue-500 text-white hover:bg-blue-600 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
          title="Buscar"
        >
          <i class="bi bi-search"></i>
        </button>
      </div>

      <!-- Botón limpiar filtro -->
      <button
        type="button"
        (click)="limpiarFiltro()"
        *ngIf="filtroForm.get('tipoFiltro')?.value"
        class="px-3 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors flex items-center gap-2"
        title="Limpiar filtros"
      >
        <i class="bi bi-x-circle"></i>
        Limpiar
      </button>
    </form>
  </div>

  <app-card-Form [titulo]="'Denuncias registradas'">
    <div *ngIf="error" class="alert alert-danger text-red-500 p-4 rounded-lg mb-4 bg-red-50 border border-red-200" role="alert">
      <div class="flex items-center">
        <svg class="w-5 h-5 text-red-500 mr-2" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
        </svg>
        {{ error }}
      </div>
    </div>

    <div class="overflow-auto bg-white shadow-xl rounded-xl max-h-[60vh] md:max-h-[55vh]">
      <tablaNavigator
        [columnas]="['idDenuncia','codigoTramite','Afectado','cedulasAfectados','fecha']"
        [encabezados]="['ID','Código Trámite','Nombre','Cédula','Fecha']"
        [datos]="pagedDenuncias"
        [isLoading]="loading"
        [emptyMessage]="'No se encontraron denuncias registradas'"
        [loadingMessage]="'Cargando denuncias...'"
        [RouterLink]="grupo+'/fases'"
        [RouterLinkparam]="'idDenuncia'"
      ></tablaNavigator>
    </div>

    <div *ngIf="!loading && !error && pagedDenuncias.length > 0" class="mt-3 flex justify-center">
      <app-paginacion
        [totalItems]="totalDenuncias"
        [pageSize]="pageSize"
        [currentPage]="currentPage"
        (pageChange)="onPageChange($event)"
      ></app-paginacion>
    </div>
  </app-card-Form>
</section>
