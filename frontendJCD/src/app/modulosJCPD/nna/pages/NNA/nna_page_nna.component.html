  <div class="bg-white   rounded-2xl p-4 shadow-lg ">
    <div class="flex justify-center text-center gap-5 ">
      <div class="bg-gray-50 p-3 shadow-lg rounded-2xl border-2 border-blue-200 grow ">
      <p  class="font-bold"  >principales activos</p>
      <ul class="">
        <li>principal 1</li>
        <li>princioal2</li>
        <li>principal3</li>
      </ul>
    </div>
    <div class="bg-gray-50 p-3 shadow-lg rounded-2xl border-2 border-green-200 grow  ">
      <p class="font-bold">denuncias activas</p>
      <p class="text-5xl">{{denunciasActivas}}</p>

    </div>

<section class="bg-white p-4">
  <div class="flex justify-between items-center mb-4 ">
    <div class="flex items-center space-x-3">
      <button
      type="button"
        routerLink="crearDenuncia"
        class="bg-yellow-400 shadow-md text-black px-4 py-2 rounded-xl flex items-center hover:bg-yellow-500 transition"
      >
        <span class="mr-2">Nueva denuncia</span>
        <span class="text-xl">+</span>
      </button>
    </div>
    <div class="w-[250px]">
      <div class="flex border rounded overflow-hidden">
        <input
          type="text"
          class="w-full px-3 py-2 outline-none"
          placeholder="Buscar..."
        />
        <span class="flex items-center justify-center px-3 bg-gray-200"
          ><i class="bi bi-search"></i
        ></span>
      </div>
    </div>
  </div>

  <!-- Loading spinner -->
  <div *ngIf="loading" class="text-center py-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <!-- Error message -->


  <!-- Table -->
    <div class="bg-white rounded-2xl p-4 shadow-xl">
    <h6 class="font-bold mb-4">Denuncias registradas</h6>
     <!-- Error message -->
    <div *ngIf="error" class="alert alert-danger text-red-500" role="alert">
    {{ error }}
    </div>

    <div
      class="overflow-auto bg-white shadow-xl rounded-xl"
      *ngIf="!loading && !error"
    >
    <global-tabla
     [columnas]="['idDenuncia','codigoTramite',  'afectados', 'cedulasAfectados','fecha']"
  [encabezados]="['ID','codigo tramite', 'Nombre', 'cedula','fecha']"
  [datos]="denuncias"
  [RouterLink]="'/nna/fases'"
  [RouterLinkparam]="'idDenuncia'"
  



    >
  </global-tabla>
