<div class="pl-2 py-2 mb-1 flex items-center gap-2">
  <a
    [routerLink]="[`../../fases/${denunciaId}`]"

      class=" px-3 py-1 font-medium rounded-xl  text-base text-left leading-tight transition-colors duration-200 flex items-center justify-center bg-gray-500 text-white hover:bg-gray-600  focus:ring-2 focus:ring-gray-500"
    >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"  class=" size-5 ">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
        </svg>

    </a>
  <h3 class="text-2xl font-bold">Informes</h3>

</div>

<hr class="border-yellow-300 border-1" />

<div class="bg-gray-50 b p-4 shadow-lg overflow-y-scroll h-[calc(100vh-8rem)]">
  <app-card-Form [titulo]="'Gestión de Informes'">
    <!-- Botón para crear informe -->
    <div class="mb-6 flex justify-end">
      <button
        type="button"
        (click)="crearInforme()"
        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200 flex items-center gap-2 font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Crear Informe
      </button>
    </div>

    <!-- Tabla de informes -->
    <div class="bg-white rounded-lg shadow">
      <app-tablaInforme
        [columnas]="columnasTabla"
        [encabezados]="encabezadosTabla"
        [datos]="datosTabla"
        [RouterLink]="grupo+'/informes'"
        [RouterLinkparam]="'idDenuncia'"
        [editar]="editarInforme"
        [eliminar]="eliminarInforme">
      </app-tablaInforme>
    </div>
  </app-card-Form>
</div>
