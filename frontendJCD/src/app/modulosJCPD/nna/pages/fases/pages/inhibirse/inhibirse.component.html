<div class="pl-2 py-2 mb-1 flex items-center gap-2">
  <a
    [routerLink]="[`../../fases/${denunciaId}`]"
      class=" px-3 py-1 font-medium rounded-xl  text-base text-left leading-tight transition-colors duration-200 flex items-center justify-center bg-gray-500 text-white hover:bg-gray-600  focus:ring-2 focus:ring-gray-500"
    >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"  class=" size-5 ">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
        </svg>
    </a>
  <h3 class="text-2xl font-bold">Inhibición</h3>
</div>
<hr class="border-yellow-300 border-1" />

<div class="p-4">
  <form [formGroup]="inhibirseForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Campo Cantón -->
    <div>
      <label for="idCantonDestino" class="block text-sm font-medium text-gray-700 mb-2">
        Cantón al que se remite *
      </label>
      <select
        id="idCantonDestino"
        formControlName="idCantonDestino"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
        [class.border-red-500]="inhibirseForm.get('idCantonDestino')?.invalid && inhibirseForm.get('idCantonDestino')?.touched"
      >
        <option value="">Seleccione un cantón</option>
        <option *ngFor="let canton of cantones" [value]="canton.id">
          {{ canton.canton }}
        </option>
      </select>
      <div
        *ngIf="inhibirseForm.get('idCantonDestino')?.invalid && inhibirseForm.get('idCantonDestino')?.touched"
        class="text-red-500 text-sm mt-1"
      >
        Este campo es obligatorio
      </div>
    </div>

    <!-- Campo Motivo -->
    <div>
      <label for="motivo" class="block text-sm font-medium text-gray-700 mb-2">
        Motivo *
      </label>
      <textarea
        id="motivo"
        formControlName="motivoDeInhibirse"
        rows="4"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
        [class.border-red-500]="inhibirseForm.get('motivoDeInhibirse')?.invalid && inhibirseForm.get('motivoDeInhibirse')?.touched"
        placeholder="Ingrese el motivo de la inhibición"
      ></textarea>
      <div
        *ngIf="inhibirseForm.get('motivoDeInhibirse')?.invalid && inhibirseForm.get('motivoDeInhibirse')?.touched"
        class="text-red-500 text-sm mt-1"
      >
        Este campo es obligatorio
      </div>
    </div>

    <!-- Botones -->
    <div class="flex gap-3 pt-4">
      <button
        type="submit"
        [disabled]="inhibirseForm.invalid"
        class="px-4 py-2 bg-blue-600 text-white rounded-md shadow-sm hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 disabled:bg-gray-400 disabled:cursor-not-allowed"
      >
        Guardar Inhibición
      </button>

      <button
        type="button"
        [routerLink]="[`../../fases/${denunciaId}`]"
        class="px-4 py-2 bg-gray-500 text-white rounded-md shadow-sm hover:bg-gray-600 focus:ring-2 focus:ring-gray-500"
      >
        Cancelar
      </button>
    </div>
  </form>
</div>
