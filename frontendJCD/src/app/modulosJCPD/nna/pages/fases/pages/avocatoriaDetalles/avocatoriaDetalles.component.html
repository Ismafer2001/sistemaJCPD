  <!-- PDF adjunto -->
  <div class="   ">
    <h3 class="text-lg font-semibold mb-2">Documento adjunto</h3>

    <div class="flex items-center justify-between bg-gray-50 border border-gray-200 px-4 py-3 rounded-lg">
      <span class="text-gray-600">avocatoria_ismael.pdf</span>
      <div class="space-x-4">
        <button class="text-blue-600 hover:underline">Ver</button>
        <button class="text-red-600 hover:underline">Eliminar</button>
      </div>
    </div>

    <div class="mt-3">
      <label class="block text-sm font-medium text-gray-700 mb-1">Subir nuevo archivo</label>
      <div
        class="border-2 border-dashed rounded-lg p-6 text-center cursor-pointer transition hover:bg-blue-50"
        (drop)="onDrop($event)"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        [class.bg-blue-100]="dragging"
        (click)="fileInput.click()"
      >
        <p class="text-gray-500 mb-2">Arrastra y suelta un archivo PDF aquí<br>o haz click para seleccionar</p>
        <input
          #fileInput
          type="file"
          (change)="onFileSelected($event)"
          accept=".pdf"
          class="hidden"
        />
        <span *ngIf="archivo" class="block mt-2 text-blue-700 font-semibold">{{ archivo.name }}</span>
      </div>
    </div>
    <button (click)="subirArchivo()">Subir</button>
  </div>

  <!-- Botones de acción -->
  <div class="flex justify-end space-x-4 pt-4 border-t">
    <button class="px-4 py-2 rounded-md bg-gray-100 hover:bg-gray-200 text-gray-700">Volver</button>

    <button class="px-4 py-2 rounded-md bg-red-500 hover:bg-red-600 text-white">Eliminar Fase</button>
  </div>
</div>
