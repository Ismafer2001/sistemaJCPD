<div class="bg-white p-4">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Fases de la Denuncia #{{denunciaId}}</h1>
    <button routerLink="/nna" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition">
      Volver
    </button>
  </div>

  <!-- Loading spinner -->
  <div *ngIf="loading" class="text-center py-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <!-- Error message -->
  <div *ngIf="error" class="alert alert-danger" role="alert">
    {{ error }}
  </div>

  <!-- Fases -->
  <div *ngIf="!loading && !error" class="space-y-4">
    <div *ngFor="let fase of fases" class="border rounded-lg p-4 hover:shadow-md transition">
      <div class="flex justify-between items-start">
        <div>
          <h3 class="text-lg font-semibold">{{ fase.nombre }}</h3>
          <p class="text-gray-600 mt-1">{{ fase.descripcion }}</p>
          <div class="mt-2 text-sm text-gray-500">
            <p *ngIf="fase.fecha_inicio">Inicio: {{ fase.fecha_inicio | date:'dd/MM/yyyy' }}</p>
            <p *ngIf="fase.fecha_fin">Fin: {{ fase.fecha_fin | date:'dd/MM/yyyy' }}</p>
          </div>
        </div>
        <div class="flex items-center space-x-2">
          <span [ngClass]="{
            'px-3 py-1 rounded-full text-sm font-medium': true,
            'bg-yellow-100 text-yellow-800': fase.estado === 'pendiente',
            'bg-blue-100 text-blue-800': fase.estado === 'en_proceso',
            'bg-green-100 text-green-800': fase.estado === 'completada'
          }">
            {{ fase.estado | titlecase }}
          </span>
          <div class="flex space-x-2">
            <button *ngIf="fase.estado === 'pendiente'" 
                    (click)="actualizarEstadoFase(fase.id, 'en_proceso')"
                    class="text-blue-600 hover:text-blue-800">
              <i class="bi bi-play-fill"></i>
            </button>
            <button *ngIf="fase.estado === 'en_proceso'" 
                    (click)="actualizarEstadoFase(fase.id, 'completada')"
                    class="text-green-600 hover:text-green-800">
              <i class="bi bi-check-lg"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
