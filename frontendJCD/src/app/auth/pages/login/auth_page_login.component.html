<div class="vh-100 d-flex justify-content-center align-items-center bg-light">
  <div class="card p-4 shadow" style="width: 300px;">
    <h4 class="text-center mb-3">Iniciar sesión</h4>
    <form [formGroup]="form" (ngSubmit)="iniciarSesion()">
    <div class="mb-3">

      <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" id="correo" formControlName="correo" class="form-control" />
    </div>
    <div class="mb-3">
      <label for="contrasena" class="form-label">Contraseña</label>
        <input type="password" id="contrasena" formControlName="contrasena" class="form-control" />
    </div>
    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
  </div>
</div>
