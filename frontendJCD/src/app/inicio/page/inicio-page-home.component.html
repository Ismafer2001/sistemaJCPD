<div class="flex flex-col items-center justify-center min-h-[calc(100svh-56px)] px-4">
  <h2 class="mb-10 font-bold text-5xl text-blue-500 text-center">Bienvenido</h2>

  <div class="grid gap-6 w-full max-w-6xl grid-cols-1 md:grid-cols-3">
    <!-- Tarjeta base (usá la misma estructura para las 3) -->


    <a
      routerLink="mujeres"
      aria-label="Ir a módulo Mujeres Víctimas de Violencia"
      class="group relative h-full overflow-hidden rounded-2xl
             bg-gradient-to-b from-yellow-400 to-yellow-300 text-gray-900
             border border-yellow-300/50 shadow-md
             p-6 flex flex-col items-center justify-center text-center gap-3
             transition-transform duration-200 hover:-translate-y-0.5 hover:shadow-lg
             focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-yellow-500/40 focus-visible:ring-offset-2 focus-visible:ring-offset-white"
    >
      <div class="h-16 w-16 grid place-items-center rounded-full bg-black/10">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-black/80" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z" clip-rule="evenodd" />
        </svg>


      </div>
      <span class="text-xl font-semibold">Mujeres Víctimas De Violencia</span>
      <span class="inline-flex items-center text-sm font-medium text-black/70">
        Entrar
        <svg class="ml-1 h-4 w-4 transition-transform group-hover:translate-x-0.5" viewBox="0 0 24 24" fill="currentColor"><path d="M13.172 12l-4.95-4.95 1.414-1.414L16 12l-6.364 6.364-1.414-1.414z"/></svg>
      </span>
    </a>
     <a
      [routerLink]="['','nna']"
      aria-label="Ir a módulo Niñez y Adolescencia"
      class="group relative h-full overflow-hidden rounded-2xl
             bg-gradient-to-b from-yellow-400 to-yellow-300 text-gray-900
             border border-yellow-300/50 shadow-md
             p-6 flex flex-col items-center justify-center text-center gap-3
             transition-transform duration-200 hover:-translate-y-0.5 hover:shadow-lg
             focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-yellow-500/40 focus-visible:ring-offset-2 focus-visible:ring-offset-white"
    >
      <div class="h-16 w-16 grid place-items-center rounded-full bg-black/10">
        <!-- ícono -->
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-black/80" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path fill-rule="evenodd" d="M8.25 6.75a3.75 3.75 0 1 1 7.5 0 3.75 3.75 0 0 1-7.5 0ZM15.75 9.75a3 3 0 1 1 6 0 3 3 0 0 1-6 0ZM2.25 9.75a3 3 0 1 1 6 0 3 3 0 0 1-6 0ZM6.31 15.117A6.745 6.745 0 0 1 12 12a6.745 6.745 0 0 1 6.709 7.498.75.75 0 0 1-.372.568A12.696 12.696 0 0 1 12 21.75c-2.305 0-4.47-.612-6.337-1.684a.75.75 0 0 1-.372-.568 6.787 6.787 0 0 1 1.019-4.38Z" clip-rule="evenodd" />
  <path d="M5.082 14.254a8.287 8.287 0 0 0-1.308 5.135 9.687 9.687 0 0 1-1.764-.44l-.115-.04a.563.563 0 0 1-.373-.487l-.01-.121a3.75 3.75 0 0 1 3.57-4.047ZM20.226 19.389a8.287 8.287 0 0 0-1.308-5.135 3.75 3.75 0 0 1 3.57 4.047l-.01.121a.563.563 0 0 1-.373.486l-.115.04c-.567.2-1.156.349-1.764.441Z" />
        </svg>
      </div>

      <span class="text-xl font-semibold">Niñez y Adolescencia</span>
      <span class="inline-flex items-center text-sm font-medium text-black/70">
        Entrar
        <svg class="ml-1 h-4 w-4 transition-transform group-hover:translate-x-0.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M13.172 12l-4.95-4.95 1.414-1.414L16 12l-6.364 6.364-1.414-1.414z"/>
        </svg>
      </span>
    </a>


    <a
      [routerLink]="['','adultos']"
      aria-label="Ir a módulo Adultos Mayores"
      class="group relative h-full overflow-hidden rounded-2xl
             bg-gradient-to-b from-yellow-400 to-yellow-300 text-gray-900
             border border-yellow-300/50 shadow-md
             p-6 flex flex-col items-center justify-center text-center gap-3
             transition-transform duration-200 hover:-translate-y-0.5 hover:shadow-lg
             focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-yellow-500/40 focus-visible:ring-offset-2 focus-visible:ring-offset-white"
    >
      <div class="h-16 w-16 grid place-items-center rounded-full bg-black/10">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-black/80" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z" clip-rule="evenodd" />
        </svg>
      </div>
      <span class="text-xl font-semibold">Adultos Mayores</span>
      <span class="inline-flex items-center text-sm font-medium text-black/70">
        Entrar
        <svg class="ml-1 h-4 w-4 transition-transform group-hover:translate-x-0.5" viewBox="0 0 24 24" fill="currentColor"><path d="M13.172 12l-4.95-4.95 1.414-1.414L16 12l-6.364 6.364-1.414-1.414z"/></svg>
      </span>
    </a>
  </div>
</div>
