<div class="p-1">
  <div class="flex justify-between items-center mb-6 border-b pb-3">
    <button routerLink="/admin/usuarios/formulario" class="bg-yellow-400 hover:bg-yellow-500 text-white px-4 py-2 rounded flex items-center" >
      <span class="mr-2">Nuevo usuario</span>
      <span class="text-lg">+</span>
    </button>
  </div>

  <h6 class="text-gray-600 mb-4">Usuarios registrados</h6>
  <div class="overflow-x-auto">
    <table class="table-auto w-full border text-sm">
      <thead class="bg-gray-100">
        <tr>
          <th class="border px-3 py-2">#</th>
          <th class="border px-3 py-2">Usuario</th>
          <th class="border px-3 py-2">Nombres</th>
          <th class="border px-3 py-2">Apellidos</th>

          <th class="border px-3 py-2">Rol</th>
          <th class="border px-3 py-2">Estado</th>
          <th class="border px-3 py-2">Cantón</th>
          <th class="border px-3 py-2">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of usuarios" class="hover:bg-gray-50">
          <td class="border px-3 py-2">{{user.id}}</td>
          <td class="border px-3 py-2">{{user.usuario}}</td>
          <td class="border px-3 py-2">{{user.nombres}}</td>
          <td class="border px-3 py-2">{{user.apellidos}}</td>
          <td class="border px-3 py-2">{{user.rol}}</td>
          <td class="border px-3 py-2">{{user.canton?.canton}}</td>

          <td class="border px-3 py-2">
            <button
                (click)="cambiarEstado(user)"
                class="px-2 py-1 rounded text-white"
                [ngClass]="user.isactivo ? 'bg-green-500' : 'bg-gray-500'">
                {{ user.isactivo ? 'Activo' : 'Deshabilitado' }}
              </button>
          </td>

          <td class="border px-3 py-2 space-x-1">
            <button (click)="editar(user)" class="bg-blue-500 hover:bg-blue-600 text-white text-xs px-2 py-1 rounded" >Editar</button>

            <button (click)="eliminar(user.id)" class="bg-red-500 hover:bg-red-600 text-white text-xs px-2 py-1 rounded" >Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
