<div class="p-1">
  <div class="flex justify-between items-center mb-6 border-b pb-3">
    <button class="bg-yellow-400 hover:bg-yellow-500 text-white px-4 py-2 rounded flex items-center" (click)="irACrear()">
      <span class="mr-2">Nuevo usuario</span>
      <span class="text-lg">+</span>
    </button>
  </div>

  <h6 class="text-gray-600 mb-4">Usuarios registrados</h6>
  <div class="overflow-x-auto">
    <table class="table-auto w-full border text-sm">
      <thead class="bg-gray-100">
        <tr>
          <th class="border px-3 py-2">#</th>
          <th class="border px-3 py-2">Usuario</th>
          <th class="border px-3 py-2">Nombres</th>
          <th class="border px-3 py-2">Apellidos</th>
          <th class="border px-3 py-2">Correo</th>
          <th class="border px-3 py-2">Rol</th>
          <th class="border px-3 py-2">Estado</th>
          <th class="border px-3 py-2">Cantón</th>
          <th class="border px-3 py-2">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuarios; index as i" class="hover:bg-gray-50">
          <td class="border px-3 py-2">{{ i + 1 }}</td>
          <td class="border px-3 py-2">{{ usuario.user }}</td>
          <td class="border px-3 py-2">{{ usuario.nombres }}</td>
          <td class="border px-3 py-2">{{ usuario.apellidos }}</td>
          <td class="border px-3 py-2">{{ usuario.correo }}</td>
          <td class="border px-3 py-2">{{ usuario.rol }}</td>
          <td class="border px-3 py-2">
            <span *ngIf="usuario.estado" class="bg-green-500 text-white px-2 py-1 rounded text-xs">Activo</span>
            <span *ngIf="!usuario.estado" class="bg-red-500 text-white px-2 py-1 rounded text-xs">Inactivo</span>
          </td>
          <td class="border px-3 py-2">{{ usuario.canton?.nombre }}</td>
          <td class="border px-3 py-2 space-x-1">
            <button class="bg-blue-500 hover:bg-blue-600 text-white text-xs px-2 py-1 rounded" (click)="editarUsuario(usuario)">Editar</button>
            <button class="bg-yellow-500 hover:bg-yellow-600 text-white text-xs px-2 py-1 rounded" (click)="cambiarEstado(usuario)">Estado</button>
            <button class="bg-red-500 hover:bg-red-600 text-white text-xs px-2 py-1 rounded" (click)="eliminarUsuario(usuario.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
